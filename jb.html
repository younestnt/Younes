<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Younes Patch PS4 — GoldHEN Loader</title>
    <!-- This page carries its own styles and starts its own module, and it
         loads NOTHING else. That duplicates a little of style.css, and it is
         deliberate: every subresource is one more allocation and one more
         timing shift in the process that core.js is about to groom, and this
         exploit is decided by exactly that. -->
    <style>
      :root {
        --bg: #05070b;
        --panel: #0a0f18;
        --sunk: #070a10;
        --line: #172438;
        --line-glow: rgba(59, 130, 246, 0.4);
        
        --fg: #cbd5e1;
        --bright: #f8fafc;
        --dim: #64748b;
        --faint: #334155;

        --ok: #38bdf8;         /* Vibrant PS4 Neon Blue Accent */
        --ok-glow: rgba(56, 189, 248, 0.25);
        --bad: #f43f5e;
        --warn: #fbbf24;

        --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
        --mono: Consolas, "Fira Code", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 14.5px/1.45 var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      /* Custom scrollbar for logs */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--sunk);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--ok);
      }

      #brand {
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }

      #brand b {
        color: var(--bright);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-shadow: 0 0 12px var(--ok-glow);
      }

      /* The live heap readout sits under the bar */
      #ramBox {
        overflow: hidden;
        padding: 6px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--sunk);
        color: var(--ok);
        font: 11px/1.4 var(--mono);
        letter-spacing: 0.05em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Running spinner under the bar */
      #spin {
        position: fixed;
        top: calc(50% + 24px);
        left: 50%;
        width: 52px;
        height: 52px;
        margin: -26px 0 0 -26px;
        border: 3px solid var(--line);
        border-top-color: var(--ok);
        border-radius: 50%;
        animation: spin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        filter: drop-shadow(0 0 10px var(--ok-glow));
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: none;
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.08em;
        padding: 0 20px;
        text-transform: uppercase;
      }

      #state,
      #out {
        display: none;
      }

      body.done #spin,
      body.fail #spin {
        display: none;
      }

      body.fail #msg {
        display: block;
        color: var(--bad);
        text-shadow: 0 0 12px rgba(244, 63, 94, 0.3);
      }

      body.done #msg {
        display: block;
        color: var(--ok);
        font-weight: 700;
        letter-spacing: 0.15em;
        text-shadow: 0 0 16px var(--ok-glow);
      }

      /* ?log=1 full step log view */
      body.log {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      body.log #spin,
      body.log #msg {
        display: none;
      }

      body.log #wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 16px 20px 32px;
      }

      body.log #state {
        display: block;
        margin: 0 0 10px;
        font-size: 18px;
        font-weight: 700;
        color: var(--bright);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--sunk);
        font: 12px/1.5 var(--mono);
        white-space: pre-wrap;
        color: var(--fg);
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
      }

      /* Retry / Error Notice box */
      .notice {
        margin: 1.2em 0;
        padding: 0.9em 1.2em;
        border: 1px solid rgba(244, 63, 94, 0.4);
        border-radius: 6px;
        background: rgba(244, 63, 94, 0.08);
        color: #fca5a5;
        font: 700 16px/1.4 var(--sans);
        box-shadow: 0 4px 12px rgba(244, 63, 94, 0.1);
      }

      .byline {
        position: fixed;
        bottom: 10px;
        left: 14px;
        margin: 0;
        color: var(--faint);
        font: 11px/1 var(--mono);
        letter-spacing: 0.08em;
        pointer-events: none;
      }

      .ok {
        color: var(--ok);
      }

      .bad {
        color: var(--bad);
      }

      .warn {
        color: var(--warn);
      }

      code {
        color: #93c5fd;
        font-family: var(--mono);
        font-size: 0.9em;
        background: rgba(147, 197, 253, 0.1);
        padding: 0.15em 0.35em;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <!-- jb.js owns the body class: .log while the step log is shown, .done or
         .fail once the chain has settled. The ids below are its contract --
         #ramBox, #msg, #state and #out are read by name. -->
    <div id="brand"><b>Younes Patch PS4 — GoldHEN</b></div>
    <div id="ramBox">RAM: checking...</div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <p class="byline">Younes Patch PS4 Edition</p>
    <script type="module">
      import "./jb.js";
    </script>
  </body>
</html>
